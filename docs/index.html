<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KSAIGrading | AI Exam Grading for Saudi Universities</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: white;
            color: black;
            line-height: 1.5;
        }

        .flag-strip {
            height: 6px;
            background: #0a6b3a;
        }

        .hero {
            position: relative;
            background: url('KSAflag.webp') center/cover no-repeat;
            text-align: center;
            padding: 100px 20px;
        }

        .hero::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1;
        }

        .hero h1, .hero p {
            position: relative;
            z-index: 2;
        }

        .hero h1 {
            font-size: 4rem;
            font-weight: 900;
            letter-spacing: -1px;
            color: white;
            text-shadow: 3px 3px 6px black;
        }

        .hero h1 .green-ai {
            color: #0a6b3a;
            text-shadow: 1px 1px 2px black;
        }

        .hero p {
            font-size: 1.2rem;
            color: white;
            text-shadow: 2px 2px 4px black;
            max-width: 600px;
            margin: 15px auto;
        }

        .btn {
            display: inline-block;
            background: #0a6b3a;
            color: white;
            padding: 12px 28px;
            border-radius: 40px;
            text-decoration: none;
            font-weight: 600;
            margin-top: 15px;
            border: none;
            cursor: pointer;
            box-shadow: 0 2px 8px black;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        .upload-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 24px;
            padding: 30px;
            text-align: center;
            border: 2px solid #0a6b3a;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }

        .upload-card input {
            display: block;
            width: 100%;
            margin: 15px 0;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        .result-box {
            background: #f0fdf4;
            border-radius: 16px;
            padding: 20px;
            margin-top: 20px;
            display: none;
        }

        footer {
            background: black;
            color: white;
            text-align: center;
            padding: 20px;
            font-size: 0.8rem;
            margin-top: 40px;
        }

        footer a {
            color: #0a6b3a;
        }

        @media (max-width: 600px) {
            .hero h1 { font-size: 2.5rem; }
            .hero { padding: 60px 20px; }
        }
    </style>
</head>
<body>
    <div class="flag-strip"></div>

    <div class="hero">
        <h1>
            <span>KS</span>
            <span class="green-ai">AI</span>
            <span>Grading</span>
        </h1>
        <p>تقييم آلي للاختبارات الجامعية<br>AI-Powered Exam Grading for Saudi Universities</p>
    </div>

    <div class="container">
        <div class="upload-card">
            <p style="font-size: 1.2rem; margin-bottom: 20px;">📄 Upload Exam Files</p>
            <input type="file" id="studentFile" accept=".txt,.csv">
            <input type="file" id="expectedFile" accept=".txt,.csv">
            <button class="btn" id="gradeBtn">Start Grading</button>
            <div id="result" class="result-box"></div>
            <p style="margin-top: 20px; font-size: 0.8rem;">Supported: .txt, .csv | PDF/OCR coming soon</p>
        </div>

        <!-- GitHub link only -->
        <div style="text-align: center; margin-top: 30px;">
            <a href="https://github.com/khvledalotaibi/KSAigrading" style="color: #0a6b3a; text-decoration: none; font-weight: bold;">🔗 GitHub Repository →</a>
        </div>
    </div>

    <footer>
        <p>© 2026 KSAIGrading | <a href="https://github.com/khvledalotaibi/KSAigrading">GitHub</a> | للاستخدام الأكاديمي</p>
    </footer>

    <script>
        document.getElementById('gradeBtn').addEventListener('click', async () => {
            const studentFile = document.getElementById('studentFile').files[0];
            const expectedFile = document.getElementById('expectedFile').files[0];
            const resultDiv = document.getElementById('result');

            if (!studentFile || !expectedFile) {
                resultDiv.style.display = 'block';
                resultDiv.innerHTML = '⚠️ Please upload both student answers and expected answers files.';
                return;
            }

            resultDiv.style.display = 'block';
            resultDiv.innerHTML = '⏳ Processing... Calling Groq API...';

            const studentText = await studentFile.text();
            const expectedText = await expectedFile.text();

            resultDiv.innerHTML = `✅ Files loaded: "${studentFile.name}" and "${expectedFile.name}"<br>
            📡 Ready to grade. Connect to grade_comparison.py backend.<br><br>
            <strong>Next step:</strong> Run your Python script with these files.`;
        });
    </script>
</body>
</html>
